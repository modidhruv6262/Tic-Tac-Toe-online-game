<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Tic-Tac-Toe</h1>
    
    <!-- NEW: NAME SCREEN -->
    <div id="nameScreen" class="glass-card">
        <h2>Welcome!</h2>
        <input type="text" id="nameInput" placeholder="Enter your name" maxlength="12">
        <button id="saveNameBtn">Continue</button>
    </div>

    <!-- LOBBY SCREEN (Now hidden by default) -->
    <div id="lobby" class="glass-card hidden">
        <h2 id="greetingText"></h2>
        <button id="createBtn">Create New Game</button>
        <p>OR</p>
        <input type="text" id="codeInput" placeholder="Enter 5-digit code" maxlength="5">
        <button id="joinBtn">Join Game</button>
        <h3 id="lobbyMessage"></h3>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameArea" class="hidden">
        <h3 id="roomDisplay"></h3>
        
        <div id="gameControls" class="hidden">
            <button id="restartBtn">Restart Game</button>
            <button id="exitBtn">Exit Room</button>
        </div>

        <h2 id="statusText">Waiting for friend to join...</h2>
        
        <div id="board" class="board">
            <div id="strike" class="strike hidden"></div>
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
