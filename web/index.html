<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Arcade Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="themeToggle" class="clay theme-btn">🌙 Dark</button>

    <h1>Arcade Hub</h1>
    
    <!-- 1. IDENTIFICATION -->
    <div id="nameScreen" class="clay-card clay">
        <h2>Welcome!</h2>
        <input type="text" id="nameInput" placeholder="e.g., Player" maxlength="12" class="clay">
        <button id="saveNameBtn" class="clay btn-primary">Continue</button>
    </div>

    <!-- 2. MODE SELECTION -->
    <div id="modeScreen" class="clay-card clay hidden">
        <h2 id="greetingText"></h2>
        <p class="subtitle">Choose your path:</p>
        <div class="mode-grid">
            <button id="vsBotBtn" class="clay btn-secondary mode-btn">🤖 Play vs. Bot</button>
            <button id="vsFriendBtn" class="clay btn-primary mode-btn">👥 Play with Friend</button>
        </div>
    </div>

    <!-- 3. ROOM LOBBY -->
    <div id="lobbyScreen" class="clay-card clay hidden">
        <h2>Multiplayer Room</h2>
        <button id="createBtn" class="clay btn-primary">Create New Room</button>
        <p class="subtitle">OR</p>
        <input type="text" id="codeInput" placeholder="Enter 4-digit code" maxlength="4" class="clay">
        <button id="joinBtn" class="clay btn-secondary">Join Room</button>
        <h3 id="lobbyMessage"></h3>
        <button id="backToModeBtn" class="clay btn-danger small-btn mt-10">← Back</button>
    </div>

    <!-- 4. THE SHARED GAME HUB -->
    <div id="hubScreen" class="clay-card clay hub-card hidden">
        <h2 id="hubRoleBanner" class="role-banner">Host: Pick a game!</h2>
        <h3 id="hubRoomDisplay"></h3>

        <!-- BOT DIFFICULTY SLIDER -->
        <div id="difficultyContainer" class="difficulty-box clay-inset hidden">
            <label for="difficultySlider" class="diff-label">Bot Difficulty: <span id="diffLabelText">Medium</span></label>
            <input type="range" id="difficultySlider" min="1" max="3" value="2" step="1" class="clay-slider">
            <div class="slider-marks">
                <span>Easy</span>
                <span>Medium</span>
                <span>Hard</span>
            </div>
        </div>
        
        <div class="game-grid">
            <div class="game-card clay" id="launchTicTacToe">
                <div class="game-icon">❌⭕</div>
                <h3>Tic-Tac-Toe</h3>
            </div>
            <div class="game-card clay locked-game">
                <div class="game-icon">🔴🟡</div>
                <h3>Connect 4</h3>
                <span class="badge">Coming Soon</span>
            </div>
            <div class="game-card clay locked-game">
                <div class="game-icon">✊✋✌️</div>
                <h3>RPS</h3>
                <span class="badge">Coming Soon</span>
            </div>
        </div>
        
        <div class="hub-controls">
            <button id="leaveHubBtn" class="clay btn-danger small-btn">Leave Room</button>
        </div>
    </div>

    <!-- 5. THE ACTIVE GAME AREA -->
    <div id="gameArea" class="hidden">
        <div id="gameControls">
            <button id="restartBtn" class="clay btn-primary">Restart Match</button>
            <button id="backToHubBtn" class="clay btn-danger">Return to Hub</button>
        </div>

        <h2 id="statusText">Loading...</h2>
        
        <div id="gameLayout">
            <!-- Board -->
            <div id="board" class="board clay">
                <div id="strike" class="strike hidden"></div>
                <div class="cell clay" data-index="0"></div>
                <div class="cell clay" data-index="1"></div>
                <div class="cell clay" data-index="2"></div>
                <div class="cell clay" data-index="3"></div>
                <div class="cell clay" data-index="4"></div>
                <div class="cell clay" data-index="5"></div>
                <div class="cell clay" data-index="6"></div>
                <div class="cell clay" data-index="7"></div>
                <div class="cell clay" data-index="8"></div>
            </div>
        </div>
    </div>

    <!-- NEW: GLOBAL SIDEBAR CHAT -->
    <div id="chatBox" class="clay-card clay hidden">
        <h3 class="chat-header">Room Chat</h3>
        <div id="chatMessages" class="clay-inset"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Type a message..." maxlength="100" class="clay">
            <button id="sendChatBtn" class="clay btn-primary">Send</button>
        </div>
    </div>

    <!-- RESULT OVERLAY -->
    <div id="resultOverlay" class="hidden">
        <div class="clay-card clay result-card">
            <h1 id="resultTitle">VICTORY!</h1>
            <button id="overlayRestartBtn" class="clay btn-primary">Play Again</button>
            <button id="overlayHubBtn" class="clay btn-secondary mt-10">Return to Hub</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
